; GBS Reimagined firmware. Commands and rules: firmware/CLAUDE.md. Toolchain choices: ADR 0010.

[platformio]
default_envs = gbsc

[common]
build_flags =
    -std=gnu++20
    -Wall
    -Wextra
    -Isrc
build_unflags =
    -std=gnu++11
    -std=gnu++14
    -std=gnu++17

; RetroScaler GBS-C: ESP-12F-style module, 4 MB flash.
[env:gbsc]
platform = espressif8266@4.2.1
framework = arduino
board = esp12e
board_build.f_cpu = 160000000L
board_build.flash_mode = dio
board_build.ldscript = eagle.flash.4m1m.ld
board_build.filesystem = littlefs
upload_speed = 460800
monitor_speed = 115200
monitor_filters = esp8266_exception_decoder, time
lib_compat_mode = strict
lib_ldf_mode = chain
build_unflags = ${common.build_unflags}
build_flags =
    ${common.build_flags}
    -DGBSR_BOARD_GBSC
    -Wno-volatile
    -DPIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY
extra_scripts =
    post:../tools/size/pio_size_report.py

; Host build: unit tests against fake devices. Runs anywhere, no board needed.
[env:native]
platform = native
test_framework = doctest
build_flags =
    ${common.build_flags}
    -DGBSR_HOST_BUILD
build_unflags = ${common.build_unflags}
build_src_filter =
    +<chip/>
    +<core/>
    +<ui/strings.gen.cpp>
    +<hal/si5351.cpp>
    +<platform/time_host.cpp>
    +<video/ops.cpp>
    +<video/adc_levels.cpp>
    +<video/picture.cpp>
test_build_src = yes
