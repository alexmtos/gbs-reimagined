name: release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-24.04
    outputs:
      created: ${{ steps.rp.outputs.release_created }}
      tag: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    uses: ./.github/workflows/ci.yml
    with:
      release_tag: ${{ needs.release-please.outputs.tag }}

  publish:
    needs: [release-please, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: firmware
          path: out
      - name: Attach binaries to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release upload "${{ needs.release-please.outputs.tag }}"
          out/gbs-reimagined-* out/SHA256SUMS
          --repo "$GITHUB_REPOSITORY"
