[project]
name = "gbs-reimagined-tools"
version = "0.0.0"
description = "Host-side tooling for GBS Reimagined: code generation, bench verification, board helpers"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0.2",
]

[dependency-groups]
bench = [
    "imageio-ffmpeg>=0.6.0",
    "numpy>=2.2",
    "opencv-python-headless>=4.11",
    "requests>=2.32",
    "pyserial>=3.5",
]
board = [
    "esptool>=5.0",
    "pyserial>=3.5",
]
dev = [
    "pytest>=8.3",
    "ruff>=0.11",
]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tools"]
