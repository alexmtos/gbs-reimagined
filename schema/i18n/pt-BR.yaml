# Textos em português do Brasil. As chaves espelham schema/settings.yaml e schema/i18n/en.yaml.
#   label  rótulo (até 20 caracteres, cabe no OLED)
#   hint   linha de dica do OLED, no máximo 21 caracteres
#   help   uma ou duas frases para a página web
#   values nomes dos valores
locale: pt-BR
name: Português (Brasil)

groups:
  output: Saída
  input: Entrada
  picture: Imagem
  system: Sistema

settings:
  output.resolution:
    label: Resolução de saída
    hint: O que a TV recebe
    help: >-
      O tamanho da imagem enviada à tela. Auto escolhe 1280x960 para fontes de 60 Hz (exatamente
      4x o 240p) e 1280x1024 para fontes de 50 Hz. Passthrough envia a fonte sem escalar; fontes HD e
      de PC sempre passam direto. O Passthrough é experimental: ainda não foi verificado numa placa.
    values:
      auto: Auto
      r1080p: 1080p
      r1024p: 1280x1024
      r960p: 1280x960
      r720p: 720p
      r480p: 480p / 576p
      r15khz: 15 kHz (CRT)
      passthrough: Passthrough (exp.)
  output.frameLock:
    label: Frame lock
    hint: Igualar taxa da fonte
    help: >-
      Faz a taxa de atualização da saída seguir exatamente o console, eliminando trepidação e
      cortes na imagem. Desligue apenas se a tela recusar a taxa levemente fora do padrão.
  output.force60:
    label: Forçar 60 Hz
    hint: Jogos 50 Hz em 60 Hz
    help: >-
      Envia fontes de 50 Hz (PAL) a 60 Hz, para telas que não aceitam 50 Hz. O frame lock não
      consegue seguir uma fonte de 50 Hz a 60 Hz, então o movimento dá pequenos trancos (um
      quadro em cinco aparece duas vezes); deixe desligado se a sua tela aceita 50 Hz.
  output.aspect:
    label: Proporção
    hint: Formato da imagem
    help: >-
      O formato da imagem na tela. 4:3 serve para a maioria dos consoles; 16:9 é para jogos com
      modo widescreen; Tela cheia estica a imagem até o formato da tela.
    values:
      a4x3: "4:3"
      a16x9: "16:9"
      full: Tela cheia
  output.hPosition:
    label: Posição horizontal
    hint: Mover esq. / dir.
    help: Move a imagem para a esquerda ou para a direita.
  output.vPosition:
    label: Posição vertical
    hint: Mover cima / baixo
    help: Move a imagem para cima ou para baixo.
  output.hSize:
    label: Largura
    hint: Mais estreita / larga
    help: Deixa a imagem mais estreita ou mais larga.
  output.vSize:
    label: Altura
    hint: Mais baixa / alta
    help: Deixa a imagem mais baixa ou mais alta.

  input.port:
    label: Entrada
    hint: Onde está o console
    help: >-
      Auto observa todas as entradas e muda para a que tiver sinal. RGB inclui SCART, os conectores
      RGBS e VGA; Componente é YPbPr.
    values:
      auto: Auto
      rgb: RGB (SCART/RGBS/VGA)
      component: Componente (YPbPr)
  input.syncThreshold:
    label: Limiar de sync
    hint: Nível do SOG
    help: >-
      O nível usado para separar o sincronismo do sync-on-green ou do sync composto (não faz nada
      com sync H/V separado). Auto procura um valor estável; aumente se a imagem rolar, diminua se
      perder sincronismo em cenas escuras. Acompanhe a qualidade do sync enquanto ajusta.
    values:
      auto: Auto
  input.phase:
    label: Fase de amostragem
    hint: Nitidez dos pixels
    help: >-
      Em que momento de cada pixel a entrada é amostrada. Ajuste olhando detalhes finos até ficar
      nítido e estável; faz mais diferença em fontes 480p e de computador. Auto usa a fase do
      programa de saída.
    values:
      auto: Auto
  input.autoGain:
    label: Ganho automático
    hint: Escurece se estourar
    help: >-
      Durante o jogo, reduz o ganho da entrada sempre que as partes mais claras da imagem estouram.
      Só escurece, e recomeça a cada nova fonte. Para níveis exatos, use Calibrar níveis com uma
      tela branca.
  input.videoLpf:
    label: Filtro passa-baixa
    hint: Filtro de entrada
    help: >-
      Filtra altas frequências antes da amostragem. Auto escolhe por padrão de vídeo; valores
      menores suavizam a imagem e reduzem cintilação de fontes ruidosas.
    values:
      auto: Auto
      f150: 150 MHz
      f110: 110 MHz
      f70: 70 MHz
      f40: 40 MHz

  picture.brightness:
    label: Brilho
    hint: Nível de preto
    help: Clareia ou escurece a imagem inteira.
  picture.contrast:
    label: Contraste
    hint: Nível de branco
    help: Aumenta ou diminui a diferença entre áreas escuras e claras.
  picture.saturation:
    label: Saturação
    hint: Intensidade das cores
    help: Deixa as cores mais fortes ou mais fracas.
  picture.sharpness:
    label: Nitidez
    hint: Realce de bordas
    help: Realça as bordas. Desligado mostra a fonte como foi amostrada.
    values:
      "off": Desligado
      low: Baixa
      medium: Média
      high: Alta
  picture.scanlines:
    label: Scanlines
    hint: Linhas estilo CRT
    help: >-
      Escurece o espaço entre as linhas do console para imitar um CRT. Funciona com fontes 240p e
      288p e pausa sozinho em 480i e 576i. Linhas uniformes pedem uma saída que seja múltiplo
      inteiro da fonte: 960p, 720p ou 480p para 240p.
  picture.scanlineStrength:
    label: Intensidade
    hint: Escuridão das linhas
    help: O quanto as scanlines são escuras.
  picture.deinterlace:
    label: Desentrelaçador
    hint: Para 480i / 576i
    help: >-
      Como imagens entrelaçadas são reconstruídas. Adaptativo a movimento mantém detalhes parados
      nítidos; Bob não tem artefatos de pente e é o mais simples.
    values:
      motionAdaptive: Adaptativo
      bob: Bob

  system.language:
    label: Idioma
    hint: Menus e página web
    help: O idioma da página web e da tela. O console serial é sempre em inglês.
    values:
      en: English
      ptBR: Português (Brasil)
  system.oledSaver:
    label: Proteção de tela
    hint: Desliga o display
    help: Desliga o display após um tempo sem uso, para proteger o OLED contra marcas.
    values:
      "off": Desligada
      m1: 1 min
      m3: 3 min
      m5: 5 min
      m10: 10 min
  system.encoderReverse:
    label: Inverter botão
    hint: Inverte o giro
    help: Inverte o sentido do botão giratório.
  system.revertSeconds:
    label: Confirmar em
    hint: Tempo p/ confirmar
    help: Quanto tempo você tem para confirmar uma mudança que pode deixar a tela preta antes de ela ser desfeita.
    values:
      s10: 10 s
      s20: 20 s
      s30: 30 s
  system.showAdvanced:
    label: Mostrar avançado
    hint: Ajustes técnicos
    help: Mostra os ajustes de amostragem, sincronismo e diagnóstico.
  system.startupProfile:
    label: Perfil inicial
    hint: Carregado ao ligar
    help: >-
      Qual perfil está em uso quando a placa liga. Último usado mantém o que você tinha, com as
      mudanças não salvas, a não ser que o perfil de outro console combine com a primeira imagem;
      Auto pela entrada sempre carrega o perfil que combina; um número carrega esse perfil.
    values:
      lastUsed: Último usado
      autoByInput: Auto pela entrada

