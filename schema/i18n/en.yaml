# English strings (reference locale). Keys mirror schema/settings.yaml.
#   label  shown everywhere (keep under 20 characters for the OLED)
#   hint   OLED bottom line, at most 21 characters
#   help   one or two sentences for the web UI and the console's `help <setting>`
#   values display names of enum values (and of `special` int values)
locale: en
name: English

groups:
  output: Output
  input: Input
  picture: Picture
  system: System

settings:
  output.resolution:
    label: Output resolution
    hint: What the TV receives
    help: >-
      The picture size sent to your display. Auto picks 1280x960 for 60 Hz sources (an exact
      4x of 240p) and 1280x1024 for 50 Hz sources. Passthrough sends the source unscaled; HD and
      PC sources always pass through. Passthrough is experimental: not yet verified on a board.
      The other (exp.) modes are computed from the display standards; your display must accept
      them.
    values:
      auto: Auto
      r1080p: 1080p
      r1024p: 1280x1024
      r960p: 1280x960
      r720p: 720p
      r480p: 480p / 576p
      r15khz: 15 kHz (CRT)
      passthrough: Passthrough (exp.)
      r1024x768: 1024x768 (exp.)
      r800x600: 800x600 (exp.)
      r1600x1200: 1600x1200 (exp.)
      r1920x1200: 1920x1200 (exp.)
  output.frameLock:
    label: Frame lock
    hint: Match source rate
    help: >-
      Makes the output refresh exactly follow the console, which removes judder and tearing.
      Turn it off only if your display refuses the slightly non-standard rate.
  output.force60:
    label: Force 60 Hz
    hint: 50 Hz games at 60 Hz
    help: >-
      Outputs 50 Hz (PAL) sources at 60 Hz for displays that do not accept 50 Hz. Frame lock
      cannot follow a 50 Hz source at 60 Hz, so motion judders slightly (one frame in five is
      shown twice); leave it off if your display takes 50 Hz.
  output.aspect:
    label: Aspect
    hint: Picture shape
    help: >-
      The shape of the picture on screen. 4:3 suits most consoles; 16:9 is for games with a
      widescreen mode; Full screen stretches the picture to the shape of the screen.
    values:
      a4x3: "4:3"
      a16x9: "16:9"
      full: Full screen
  output.hPosition:
    label: Horizontal position
    hint: Move left / right
    help: Moves the picture left or right.
  output.vPosition:
    label: Vertical position
    hint: Move up / down
    help: Moves the picture up or down.
  output.hSize:
    label: Horizontal size
    hint: Narrower / wider
    help: Makes the picture narrower or wider.
  output.integerScale:
    label: Integer scale
    hint: Even lines, smaller
    help: >-
      Shows every line of the console as the same number of screen lines (four at 1080p for 240p
      games), so scanlines and pixels come out even. The picture gets a little smaller, with black
      borders, and Vertical size has no effect while it is on.
  output.vSize:
    label: Vertical size
    hint: Shorter / taller
    help: Makes the picture shorter or taller.

  input.port:
    label: Input
    hint: Where the console is
    help: >-
      Auto watches all inputs and switches to the one with a signal. RGB covers SCART, the RGBS
      jacks and VGA; Component is YPbPr.
    values:
      auto: Auto
      rgb: RGB (SCART/RGBS/VGA)
      component: Component (YPbPr)
  input.syncThreshold:
    label: Sync threshold
    hint: SOG slicer level
    help: >-
      The level used to separate sync from sync-on-green or composite sync (it does nothing with
      separate H/V sync). Auto searches for a stable value; raise it if the picture rolls, lower it
      if it loses sync on dark scenes. Watch the sync quality while you change it.
    values:
      auto: Auto
  input.phase:
    label: Sampling phase
    hint: Pixel sharpness
    help: >-
      When within each pixel the input is sampled. Adjust while watching fine detail until it is
      sharp and stable; it matters most for 480p and computer sources. Auto uses the output
      program's phase.
    values:
      auto: Auto
  input.autoGain:
    label: Auto gain
    hint: Dims when it clips
    help: >-
      While you play, lowers the input gain whenever the brightest parts of the picture clip. It
      only ever darkens, and starts again for each new source. For exact levels, use Calibrate
      levels with a white screen instead.
  input.videoLpf:
    label: Video LPF
    hint: Input low-pass filter
    help: >-
      Filters high frequencies before sampling. Auto chooses per standard; lower values soften
      the picture and reduce shimmer from noisy sources.
    values:
      auto: Auto
      f150: 150 MHz
      f110: 110 MHz
      f70: 70 MHz
      f40: 40 MHz

  picture.brightness:
    label: Brightness
    hint: Black level
    help: Raises or lowers the whole picture.
  picture.contrast:
    label: Contrast
    hint: White level
    help: Increases or decreases the difference between dark and bright areas.
  picture.saturation:
    label: Saturation
    hint: Colour intensity
    help: Makes colours stronger or weaker.
  picture.sharpness:
    label: Sharpness
    hint: Edge enhancement
    help: Emphasises edges. Off shows the source as sampled.
    values:
      "off": "Off"
      low: Low
      medium: Medium
      high: High
  picture.scanlines:
    label: Scanlines
    hint: CRT-style lines
    help: >-
      Darkens the gaps between the console's lines to imitate a CRT. Works on 240p and 288p
      sources and pauses by itself on 480i and 576i. Even lines need an output that is a whole
      multiple of the source: 960p, 720p or 480p for 240p.
  picture.scanlineStrength:
    label: Scanline strength
    hint: Line darkness
    help: How dark the scanlines are.
  picture.deinterlace:
    label: Deinterlacer
    hint: For 480i / 576i
    help: >-
      How interlaced pictures are rebuilt. Motion adaptive keeps still detail sharp; Bob has no
      combing artefacts and the least processing.
    values:
      motionAdaptive: Motion adaptive
      bob: Bob

  system.language:
    label: Language
    hint: Menus and web page
    help: >-
      The language of the web page and of the board's screen. On the web page, choose it at the
      top. The serial console is always English.
    values:
      en: English
      ptBR: Português (Brasil)
  system.oledSaver:
    label: Display saver
    hint: Dim the display
    help: Turns the display off after a period without use, to protect the OLED from burn-in.
    values:
      "off": "Off"
      m1: 1 min
      m3: 3 min
      m5: 5 min
      m10: 10 min
  system.encoderReverse:
    label: Reverse knob
    hint: Swap knob direction
    help: Swaps the direction of the knob.
  system.revertSeconds:
    label: Confirm within
    hint: Time to keep changes
    help: How long you have to confirm a change that could leave the screen black before it is undone.
    values:
      s10: 10 s
      s20: 20 s
      s30: 30 s
  system.showAdvanced:
    label: Show advanced
    hint: Expert settings
    help: >-
      Shows the settings for sampling, sync and diagnostics, on the web page and in the board's
      menu. The switch at the bottom of every page is this same setting.
  system.startupProfile:
    label: Startup profile
    hint: Loaded at power-on
    help: >-
      Which profile is in use when the board starts. Last used keeps the one you had, unsaved
      changes included, unless another console's profile matches the first picture; Auto by input
      always loads the profile that matches; a number loads that profile.
    values:
      lastUsed: Last used
      autoByInput: Auto by input

